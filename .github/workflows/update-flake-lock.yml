name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update:
    uses: genebean/.github/.github/workflows/update-flake-lock.yml@main
    with:
      npm-lock-file: package-lock.json
      npmDepsHash-glob: |
        pkgs/hermes-social-digest-pipeline.nix
        pkgs/npm-check.nix
    secrets:
      token: ${{ secrets.CI_FLAKE_UPDATES }}
